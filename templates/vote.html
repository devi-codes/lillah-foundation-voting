<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Your Vote - Lillah Foundation</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f0df;
            color: #173f2b;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 25px;
        }
        h1 {
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }
        .name-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .candidates {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .candidate {
            background: white;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        .candidate img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            margin: 0 auto 15px;
        }
        .candidate h3 {
            margin: 10px 0 15px;
        }
        .candidate button {
            border: none;
            padding: 11px 20px;
            background: #173f2b;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        .candidate button:hover {
            background: #245b3d;
        }
        .notice {
            margin-top: 30px;
            padding: 18px;
            background: #fff8e8;
            border-radius: 12px;
            text-align: center;
        }
        @media (max-width: 650px) {
            .candidates {
                grid-template-columns: 1fr;
            }
            .candidate img {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>LILLAH FOUNDATION</h1>
    <div class="subtitle">
        PRESIDENT VOTING
    </div>
    <div class="name-box">
        <label for="voterName">
            Enter your full name
        </label>
        <input
            type="text"
            id="voterName"
            placeholder="Enter your name"
            required
        >
    </div>
    <div class="candidates">
        <!-- ARSALAN MAHMOOD -->
        <div class="candidate">
            <img
                src="{{ url_for('static', filename='arsalan mahmood.jpeg') }}"
                alt="Arsalan Mahmood"
            >
            <h3>Arsalan Mahmood</h3>
            <form
                method="POST"
                action="{{ url_for('submit_vote') }}"
                onsubmit="return prepareVote(this, 'Arsalan Mahmood')"
            >
                <input
                    type="hidden"
                    name="voter_name"
                    class="hidden-name"
                >
                <input
                    type="hidden"
                    name="candidate"
                    value="Arsalan Mahmood"
                >
                <button type="submit">
                    Vote
                </button>
            </form>
        </div>
        <!-- TASLIM AKHTAR -->
        <div class="candidate">
            <img
                src="{{ url_for('static', filename='taslim akhtar.jpeg') }}"
                alt="Taslim Akhtar"
            >
            <h3>Taslim Akhtar</h3>
            <form
                method="POST"
                action="{{ url_for('submit_vote') }}"
                onsubmit="return prepareVote(this, 'Taslim Akhtar')"
            >
                <input
                    type="hidden"
                    name="voter_name"
                    class="hidden-name"
                >
                <input
                    type="hidden"
                    name="candidate"
                    value="Taslim Akhtar"
                >
                <button type="submit">
                    Vote
                </button>
            </form>
        </div>
        <!-- SALEHEEN SALAM -->
        <div class="candidate">
            <img
                src="{{ url_for('static', filename='saleheen salam.jpeg') }}"
                alt="Saleheen Salam"
            >
            <h3>Saleheen Salam</h3>
            <form
                method="POST"
                action="{{ url_for('submit_vote') }}"
                onsubmit="return prepareVote(this, 'Saleheen Salam')"
            >
                <input
                    type="hidden"
                    name="voter_name"
                    class="hidden-name"
                >
                <input
                    type="hidden"
                    name="candidate"
                    value="Saleheen Salam"
                >
                <button type="submit">
                    Vote
                </button>
            </form>
        </div>
        <!-- SIKANDAR AZAM -->
        <div class="candidate">
            <img
                src="{{ url_for('static', filename='sikandar azam 2.jpeg') }}"
                alt="Sikandar Azam"
            >
            <h3>Sikandar Azam</h3>
            <form
                method="POST"
                action="{{ url_for('submit_vote') }}"
                onsubmit="return prepareVote(this, 'Sikandar Azam')"
            >
                <input
                    type="hidden"
                    name="voter_name"
                    class="hidden-name"
                >
                <input
                    type="hidden"
                    name="candidate"
                    value="Sikandar Azam"
                >
                <button type="submit">
                    Vote
                </button>
            </form>
        </div>
        <!-- LAREB KHAN -->
        <div class="candidate">
            <img
                src="{{ url_for('static', filename='lareb khan.jpeg') }}"
                alt="Lareb Khan"
            >
            <h3>Lareb Khan</h3>
            <form
                method="POST"
                action="{{ url_for('submit_vote') }}"
                onsubmit="return prepareVote(this, 'Lareb Khan')"
            >
                <input
                    type="hidden"
                    name="voter_name"
                    class="hidden-name"
                >
                <input
                    type="hidden"
                    name="candidate"
                    value="Lareb Khan"
                >
                <button type="submit">
                    Vote
                </button>
            </form>
        </div>
    </div>
    <div class="notice">
        <strong>Important:</strong>
        You can vote only once. Your vote cannot be changed after submission.
    </div>
</div>
<script>
function prepareVote(form, candidateName) {
    const voterName = document
        .getElementById("voterName")
        .value
        .trim();
    if (!voterName) {
        alert("Please enter your full name first.");
        document
            .getElementById("voterName")
            .focus();
        return false;
    }
    const confirmation = confirm(
        "You are voting for " +
        candidateName +
        ".\n\nAre you sure you want to submit your vote?"
    );
    if (!confirmation) {
        return false;
    }
    form.querySelector(".hidden-name").value = voterName;
    return true;
}
</script>
</body>
</html>
