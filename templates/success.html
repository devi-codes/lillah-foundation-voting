<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vote Submitted - LILLAH FOUNDATION</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, serif;
            background: #f5f0e4;
            color: #123f35;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 650px;

            padding: 50px 35px;

            border-radius: 20px;

            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .check {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 38px;
            margin: 10px 0;
        }

        .line {
            width: 150px;
            height: 3px;

            background: #c6a15b;

            margin: 20px auto;
        }

        .thank-you {
            font-size: 20px;
            margin: 20px 0;
        }

        .candidate-box {
            background: #f7f4ec;

            padding: 20px;

            border-radius: 12px;

            margin: 25px 0;

            font-family: Arial, sans-serif;
        }

        .candidate-box strong {
            display: block;

            font-size: 22px;

            margin-top: 8px;
        }

        .notice {
            font-family: Arial, sans-serif;

            color: #666;

            font-size: 14px;

            line-height: 1.6;
        }

        .home-button {
            display: inline-block;

            margin-top: 25px;

            padding: 14px 28px;

            background: #123f35;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-family: Arial, sans-serif;
        }

        .home-button:hover {
            background: #0b3028;
        }

        @media (max-width: 600px) {

            .card {
                padding: 40px 20px;
            }

            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>

<div class="card">

    <div class="check">
        ✓
    </div>

    <h1>
        Vote Submitted Successfully!
    </h1>

    <div class="line"></div>

    <div class="thank-you">
        Thank you, {{ voter_name }}.
    </div>

    <div class="candidate-box">

        Your vote has been recorded for:

        <strong>
            {{ candidate }}
        </strong>

    </div>

    <div class="notice">

        Your vote cannot be changed or submitted again
        from this voting session.

        <br><br>

        Your individual vote remains confidential
        from other voters.

    </div>

    <a href="/" class="home-button">
        Return to Home
    </a>

</div>

</body>

</html>
